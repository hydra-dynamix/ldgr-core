name: Binary release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release. Must match Cargo.toml."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  static:
    name: Validate release workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: Run release contract static fixtures
        run: cargo test --locked --test release_pipeline release_workflow_

  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"]=="ldgr-core"))')"
          requested_version="${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}"
          version="${requested_version:-$cargo_version}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must use semantic version syntax" >&2
            exit 1
          fi
          if [[ "$version" != "$cargo_version" ]]; then
            echo "requested version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}" >&2
            exit 1
          fi
          prerelease="false"
          if [[ "$version" == *-* ]]; then prerelease="true"; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ inputs.prerelease }}" != "$prerelease" ]]; then
            echo "prerelease input must match the semantic version channel" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} binary release
    needs:
      - static
      - metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_ext: ""
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            binary_ext: ""
          - os: macos-15-intel
            platform: macos-x86_64
            binary_ext: ""
          - os: macos-14
            platform: macos-aarch64
            binary_ext: ""
          - os: windows-latest
            platform: windows-x86_64
            binary_ext: ".exe"
    env:
      PACKAGE: ldgr-core
      BINARY: ldgr
      RELEASE_NAME: ldgr-core
      AGENTCTL_VERSION: 0.1.2
      AGENTCTL_REPOSITORY: hydra-dynamix/agentctl
      AGENTCTL_REF: aa5c007fd2335ad507f1f24e3460d8f531f863f3
    steps:
      - uses: actions/checkout@v4

      - name: Checkout paired agentctl source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AGENTCTL_REPOSITORY }}
          ref: ${{ env.AGENTCTL_REF }}
          path: agentctl-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --locked --release -p "$PACKAGE"
        shell: bash

      - name: Smoke test binary
        run: |
          "target/release/${BINARY}${{ matrix.binary_ext }}" --version
        shell: bash

      - name: Test Windows installer PATH handling
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: |
          tests/install_path.ps1
          tests/install_catalog.ps1

      - name: Build paired agentctl dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C agentctl-source rev-parse HEAD)" = "$AGENTCTL_REF"
          cargo build --locked --release \
            --manifest-path agentctl-source/Cargo.toml \
            --target-dir target/release-agentctl
          agentctl_binary="target/release-agentctl/release/agentctl${{ matrix.binary_ext }}"
          test "$("$agentctl_binary" --version)" = "agentctl ${AGENTCTL_VERSION}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          platform="${{ matrix.platform }}"
          binary_file="${BINARY}${{ matrix.binary_ext }}"
          agentctl_file="agentctl${{ matrix.binary_ext }}"
          staging="dist/${RELEASE_NAME}-${version}/${platform}"
          archive="dist/${RELEASE_NAME}-${version}-${platform}.tar.gz"
          mkdir -p "$staging"
          cp "target/release/${binary_file}" "$staging/${binary_file}"
          cp "target/release-agentctl/release/${agentctl_file}" "$staging/${agentctl_file}"
          chmod +x "$staging/${binary_file}" || true
          chmod +x "$staging/${agentctl_file}" || true
          cp README.md LICENSE schema/core-compatibility.json "dist/${RELEASE_NAME}-${version}/"
          if [[ -f scripts/install.sh ]]; then mkdir -p "dist/${RELEASE_NAME}-${version}/scripts"; cp scripts/install.sh "dist/${RELEASE_NAME}-${version}/scripts/install.sh"; fi
          cat > "dist/${RELEASE_NAME}-${version}/RELEASE-METADATA.json" <<JSON
          {
            "schema_version": 1,
            "package": "${PACKAGE}",
            "binary": "${BINARY}",
            "version": "${version}",
            "agentctl_version": "${AGENTCTL_VERSION}",
            "agentctl_repository": "${AGENTCTL_REPOSITORY}",
            "agentctl_commit": "$(git -C agentctl-source rev-parse HEAD)",
            "launcher_compatibility_schema": "ldgr.launcher-compatibility.v1",
            "error_recovery_schema": 1,
            "platform": "${platform}",
            "commit": "${GITHUB_SHA}",
            "source_repository": "${GITHUB_REPOSITORY}"
          }
          JSON
          tar -C dist -czf "$archive" "${RELEASE_NAME}-${version}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/ldgr-core-${{ needs.metadata.outputs.version }}-${{ matrix.platform }}.tar.gz
            dist/ldgr-core-${{ needs.metadata.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  sign:
    name: Sign complete release candidate
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: ldgr-core
      LDGR_CATALOG_SIGNING_KEY: ${{ secrets.LDGR_CATALOG_SIGNING_KEY }}
      LDGR_ARCHIVE_SIGNING_KEY: ${{ secrets.LDGR_ARCHIVE_SIGNING_KEY || secrets.LDGR_CATALOG_SIGNING_KEY }}
      CATALOG_KEY_ID: ${{ vars.LDGR_CATALOG_SIGNING_KEY_ID || 'ldgr-release-2026-01' }}
      ARCHIVE_KEY_ID: ${{ vars.LDGR_ARCHIVE_SIGNING_KEY_ID || vars.LDGR_CATALOG_SIGNING_KEY_ID || 'ldgr-release-2026-01' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout published catalog
        uses: actions/checkout@v4
        with:
          repository: hydra-dynamix/ldgr-releases
          path: catalog-repository

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate archive signatures and catalog candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LDGR_CATALOG_SIGNING_KEY"
          test -n "$LDGR_ARCHIVE_SIGNING_KEY"
          version="${{ needs.metadata.outputs.version }}"
          channel=stable
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then channel=prerelease; fi
          mkdir -p candidate
          cargo run --locked --features release-tooling --bin ldgr-release -- \
            --existing-catalog catalog-repository/core-index.json \
            --existing-signature catalog-repository/core-index.json.sig \
            --trusted-keyring release-keyring.json --dist dist \
            --output-catalog candidate/core-index.json \
            --output-signature candidate/core-index.json.sig \
            --previous-version-output candidate/previous-version.txt \
            --version "$version" --channel "$channel" \
            --minimum-updater-version \
              "$(jq -r '.releases[-1].version' catalog-repository/core-index.json)" \
            --archive-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}" \
            --catalog-key-id "$CATALOG_KEY_ID" --archive-key-id "$ARCHIVE_KEY_ID"
          cp release-keyring.json candidate/release-keyring.json

      - name: Stage signed release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          tag="v${version}"
          title="${RELEASE_NAME} v${version}"
          prerelease_flag=""
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" \
              --notes "${RELEASE_NAME} ${version} signed release candidate from ${GITHUB_SHA}." \
              $prerelease_flag
          fi
          gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.tar.gz.sig --clobber

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: |
            candidate/core-index.json
            candidate/core-index.json.sig
            candidate/previous-version.txt
            candidate/release-keyring.json
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sig
          if-no-files-found: error

  release-gate:
    name: Previous-version update ${{ matrix.platform }}
    needs:
      - metadata
      - sign
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prove rollback checkpoints
        run: cargo test --locked --lib update::apply::tests::injected_failure_after_each_paired_activation_checkpoint_restores_every_target -- --exact
      - name: Test signed installers and previous-version update
        if: matrix.platform != 'windows-x86_64'
        shell: bash
        env:
          TARGET_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ldgr-release-gate"
          previous="$(tr -d '\r\n' < candidate/candidate/previous-version.txt)"
          catalog="file://$PWD/candidate/candidate/core-index.json"
          helper="file://$PWD/scripts/core-catalog.py"
          keyring="file://$PWD/candidate/candidate/release-keyring.json"
          HOME="$root/home" LDGR_INSTALL_DIR="$root/previous" LDGR_VERSION="$previous" \
            LDGR_CORE_UPDATE_INDEX="$catalog" LDGR_CORE_CATALOG_HELPER="$helper" \
            LDGR_CORE_RELEASE_KEYRING="$keyring" sh scripts/install.sh
          HOME="$root/home" LDGR_CORE_UPDATE_INDEX="$catalog" \
            LDGR_CORE_RELEASE_KEYRING="$keyring" \
            "$root/previous/ldgr" update --core-only --yes
          test "$("$root/previous/ldgr" --version)" = "ldgr $TARGET_VERSION"
          HOME="$root/current-home" LDGR_INSTALL_DIR="$root/current" \
            LDGR_VERSION="$TARGET_VERSION" LDGR_CORE_UPDATE_INDEX="$catalog" \
            LDGR_CORE_CATALOG_HELPER="$helper" LDGR_CORE_RELEASE_KEYRING="$keyring" \
            sh scripts/install.sh
          test "$("$root/current/ldgr" --version)" = "ldgr $TARGET_VERSION"
          "$root/current/ldgr" compatibility \
            --agentctl-version "$("$root/current/agentctl" --version | awk '{print $2}')" --json
      - name: Test signed Windows installer and previous-version update
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        env:
          TARGET_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ldgr-release-gate"
          $catalog = [Uri](Resolve-Path "candidate/candidate/core-index.json")
          $helper = [Uri](Resolve-Path "scripts/core-catalog.py")
          $keyring = [Uri](Resolve-Path "candidate/candidate/release-keyring.json")
          $previous = (Get-Content -Raw "candidate/candidate/previous-version.txt").Trim()
          $env:HOME = Join-Path $root "home"
          $env:USERPROFILE = $env:HOME
          $env:LDGR_INSTALL_DIR = Join-Path $root "previous"
          $env:LDGR_VERSION = $previous
          $env:LDGR_CORE_UPDATE_INDEX = $catalog.AbsoluteUri
          $env:LDGR_CORE_CATALOG_HELPER = $helper.AbsoluteUri
          $env:LDGR_CORE_RELEASE_KEYRING = $keyring.AbsoluteUri
          & scripts/install.ps1
          & "$env:LDGR_INSTALL_DIR/ldgr.exe" update --core-only --yes
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 250
            $installed = (& "$env:LDGR_INSTALL_DIR/ldgr.exe" --version).Trim()
          } while ($installed -ne "ldgr $env:TARGET_VERSION" -and [DateTime]::UtcNow -lt $deadline)
          if ($installed -ne "ldgr $env:TARGET_VERSION") { throw "Previous-version update did not finalize." }
          $env:HOME = Join-Path $root "current-home"
          $env:USERPROFILE = $env:HOME
          $env:LDGR_INSTALL_DIR = Join-Path $root "current"
          $env:LDGR_VERSION = $env:TARGET_VERSION
          & scripts/install.ps1
          if ((& "$env:LDGR_INSTALL_DIR/ldgr.exe" --version).Trim() -ne "ldgr $env:TARGET_VERSION") {
            throw "Current signed installer version check failed."
          }

  publish:
    name: Publish signed catalog last
    needs:
      - metadata
      - sign
      - release-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CATALOG_TOKEN: ${{ secrets.LDGR_CATALOG_REPOSITORY_TOKEN }}
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          repository: hydra-dynamix/ldgr-releases
          token: ${{ env.CATALOG_TOKEN }}
          path: catalog-repository
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate
      - name: Verify staged release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          assets="$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            archive="ldgr-core-${version}-${platform}.tar.gz"
            grep -Fx "$archive" <<<"$assets"
            grep -Fx "$archive.sha256" <<<"$assets"
            grep -Fx "$archive.sig" <<<"$assets"
            (cd candidate && sha256sum -c "dist/$archive.sha256")
            test -s "candidate/dist/$archive.sig"
          done
      - name: Finalize GitHub release metadata
        shell: bash
        run: |
          args=(--draft=false)
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then args+=(--prerelease); else args+=(--latest); fi
          gh release edit "v${{ needs.metadata.outputs.version }}" "${args[@]}"
      - name: Publish signed Core catalog
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/candidate/core-index.json catalog-repository/core-index.json
          cp candidate/candidate/core-index.json.sig catalog-repository/core-index.json.sig
          cd catalog-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core-index.json core-index.json.sig
          git diff --cached --check
          git commit -m "release(core): publish v${{ needs.metadata.outputs.version }}"
          git push origin HEAD:main
